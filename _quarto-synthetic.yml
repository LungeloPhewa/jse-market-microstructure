# Profile used by CI: `JSEMICRO_DATA=synthetic quarto render --profile synthetic`
# re-executes every chapter on the simulated exports (no freeze) and writes a
# separate site that is published under /synthetic/.
project:
  output-dir: _book_synthetic
book:
  title: "Market Microstructure of the JSE from Tick Data (synthetic-data build)"
execute:
  freeze: false
